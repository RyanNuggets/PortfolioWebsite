<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nugget Studios</title>

  <!-- Font (optional) -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ================= NAVBAR ================= -->
    <header class="navbar-header">
    <nav class="navbar fade-in">
      <a href="/" class="nav-home" aria-label="Home">
        <img src="images/logo2.png" alt="Logo" class="nav-logo">
      </a>

      <div class="nav-links">
        <a href="/about" class="nav-link">About</a>
        <a href="/clients" class="nav-link">Clients</a>
        <a href="/past-work" class="nav-link">Past Work</a>
        <a href="/goals" class="nav-link">Goals</a>
        <a href="/contact" class="nav-link">Contact</a>
      </div>

      <div class="nav-cta-wrap">
        <a href="/contact" class="nav-cta">Order Now</a>
      </div>
    </nav>
  </header>

  <!-- ================= HERO ================= -->
  <section class="hero fade-in">
    <img src="images/logo.png" alt="Main Logo" class="hero-logo">

    <h1>Nugget Studios</h1>
    <p>Premium graphics, built to impress</p>

    <!-- CTA BUTTONS -->
    <div class="cta-group">
      <a href="/contact" class="cta">Get Started</a>
      <a href="/past-work" class="cta secondary">Past Work</a>
    </div>
  </section>

  <!-- ================= FOOTER STRIP ================= -->
  <section class="footer-strip">
    <div class="footer-divider"></div>

    <div class="footer-inner">
      <img src="images/logo2.png" alt="Footer Logo" class="footer-logo">

      <p class="footer-text">
        Copyright © 2026 Nuggets Studios. All rights reserved.
      </p>
    </div>
  </section>

  <!-- JS (kept for future use) -->
  <script src="js/main.js"></script>
</body>
</html>
